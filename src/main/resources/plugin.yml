name: CoreArchive
main: net.corearchive.CoreArchive
version: ${project.version}
branch: ${project.branch}
api-version: 1.16
folia-supported: true
website: https://github.com/PlayPro/CoreProtect
author: Intelli, _NickVo, Claude
softdepend: [WorldEdit]
description: Lookups and rollbacks against an archived CoreProtect database. Does not log new events.
libraries:
  - org.duckdb:duckdb_jdbc:${duckdb.version}
commands:
  ca:
    description: Utilize the plugin
    permission: corearchive.ca
    permission-message: §3CoreArchive §f- You do not have permission to do that.
    usage: /<command> <params>
  carchive:
    description: Utilize the plugin
    permission: corearchive.carchive
    permission-message: §3CoreArchive §f- You do not have permission to do that.
    usage: /<command> <params>
  corearchive:
    description: Utilize the plugin
    permission: corearchive.corearchive
    permission-message: §3CoreArchive §f- You do not have permission to do that.
    usage: /<command> <params>
permissions:
    corearchive.*:
        description: Gives access to all CoreArchive actions and commands
        default: op
        children: 
            corearchive.rollback: true
            corearchive.restore: true
            corearchive.inspect: true
            corearchive.help: true
            corearchive.purge: true
            corearchive.lookup: true
            corearchive.lookup.near: true
            corearchive.lookup.chat: true
            corearchive.lookup.command: true
            corearchive.lookup.session: true
            corearchive.lookup.username: true
            corearchive.lookup.block: true
            corearchive.lookup.sign: true
            corearchive.lookup.click: true
            corearchive.lookup.container: true
            corearchive.lookup.inventory: true
            corearchive.lookup.item: true
            corearchive.lookup.kill: true
            corearchive.lookup.spawn: true
            corearchive.teleport: true
            corearchive.reload: true
            corearchive.status: true
            corearchive.consumer: true
            corearchive.networking: true
            corearchive.give: false
    corearchive.ca:
        description: Has permission to access the CoreArchive /ca command
        default: true
    corearchive.carchive:
        description: Has permission to access the CoreArchive /carchive command
        default: false
    corearchive.corearchive:
        description: Has permission to access the CoreArchive /corearchive command
        default: false
    corearchive.lookup:
        description: Has permission to use the lookup command
        default: op
        children:
            corearchive.lookup.near: true
            corearchive.lookup.chat: true
            corearchive.lookup.command: true
            corearchive.lookup.session: true
            corearchive.lookup.username: true
            corearchive.lookup.block: true
            corearchive.lookup.sign: true
            corearchive.lookup.click: true
            corearchive.lookup.container: true
            corearchive.lookup.inventory: true
            corearchive.lookup.item: true
            corearchive.lookup.kill: true
            corearchive.lookup.spawn: true
    corearchive.lookup.near:
        description: Has permission to lookup nearby changes via the near command
        default: op
    corearchive.lookup.chat:
        description: Has permission to lookup chat messages
        default: op
    corearchive.lookup.command:
        description: Has permission to lookup player commands
        default: op
    corearchive.lookup.session:
        description: Has permission to lookup player sessions
        default: op
    corearchive.lookup.username:
        description: Has permission to lookup player username changes
        default: op
    corearchive.lookup.block:
        description: Has permission to lookup block data
        default: op
    corearchive.lookup.sign:
        description: Has permission to lookup sign messages
        default: op
    corearchive.lookup.click:
        description: Has permission to lookup player interactions
        default: op
    corearchive.lookup.container:
        description: Has permission to lookup container transactions
        default: op
    corearchive.lookup.inventory:
        description: Has permission to lookup inventory transactions
        default: op
    corearchive.lookup.item:
        description: Has permission to lookup item transactions
        default: op
    corearchive.lookup.kill:
        description: Has permission to lookup entity kills
        default: op
    corearchive.lookup.spawn:
        description: Has permission to lookup entity spawns
        default: op
    corearchive.rollback:
        description: Has permission to perform rollbacks
        default: op
    corearchive.restore:
        description: Has permission to perform restores
        default: op
    corearchive.inspect:
        description: Has permission to use the inspector
        default: op
    corearchive.help:
        description: Has permission to use the help command
        default: op
    corearchive.purge:
        description: Has permission to use the purge command
        default: op
    corearchive.teleport:
        description: Has permission to use the teleport command
        default: op
    corearchive.reload:
        description: Has permission to use the reload command
        default: op
    corearchive.status:
        description: Has permission to use the status command
        default: op
    corearchive.consumer:
        description: Has permission to use the consumer command
        default: op
    corearchive.networking:
        description: Has permission to use the networking API
        default: op
    corearchive.give:
        description: Has permission to use the give command
        default: false
